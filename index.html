<!doctype html>
<html lang="nb" style="background-color: #030712;">
  <head>
    <meta charset="UTF-8" />
    <!--
      Fullskjerm på mobil uten zoom: viewport-fit=cover lar appen bruke hele
      skjermen (safe-area håndteres i CSS). Zoom er låst etter ønske.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#030712" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Disc Golf RPG" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Disc Golf RPG</title>

    <style>
      html, body {
        background-color: #030712 !important;
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }
      #root {
        background-color: #030712;
        min-height: 100%;
      }
    </style>
  </head>
  <body style="background-color: #030712; margin: 0;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
